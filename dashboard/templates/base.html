<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Room Occupancy Dashboard{% endblock %}</title>

  <!-- Fonts / Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="material-icons-round">dashboard</span>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-title">RBS Admin</div>
          <div class="sidebar-brand-sub">Occupancy Console</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link {% if active_page == 'overview' %}active{% endif %}" href="{{ url_for('overview') }}">
          <span class="material-icons-round">dashboard</span>
          <span>Dashboard</span>
        </a>
      </nav>

      <!-- More realistic footer -->
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="material-icons-round">admin_panel_settings</span>
          <div>
            <div class="sidebar-user-name">System Admin</div>
            <div class="sidebar-user-role">Operations</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
